name: Build Android APK

on:
  # DISEDERHANAKAN kembali ke 1 branch (main) atas keputusan developer:
  # setiap push ke main langsung build+publish, TIDAK ada lagi branch
  # "release" terpisah.
  #
  # CATATAN RISIKO (sengaja ditulis di sini, bukan dihapus, biar developer
  # yang baca workflow ini nanti tetap ingat kenapa skema release pernah
  # dibuat): kalau push beberapa kali berturut-turut sambil iterasi/testing
  # di HP, tiap push langsung menerbitkan rilis baru ke GitHub Pages —
  # pemain yang sedang hot-update bisa "mengejar target yang terus
  # bergerak" (rilis baru terbit sebelum unduhan rilis sebelumnya selesai).
  # Kalau ini mulai mengganggu pemain, opsi mitigasi paling sederhana:
  # tambahkan "[skip build]" di pesan commit untuk push iterasi/testing
  # (lalu tambahkan guard di job ini: skip kalau commit message mengandung
  # "[skip build]"), tanpa perlu balik ke skema 2-branch.
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # PENTING: workflow ini commit balik anumpoly.apk + versi.json ke main
    # di step terakhir (supaya update dalam-game bisa jalan). Commit balik
    # itu sendiri akan memicu event "push" lagi ke main, yang tanpa guard
    # ini akan menjalankan build-android.yml LAGI tanpa henti (infinite
    # loop). Sebelumnya dicegah pakai tag "[skip ci]" di pesan commit —
    # TERNYATA tag itu levelnya GLOBAL di GitHub: bukan cuma mematikan
    # workflow INI, tapi ikut mematikan SEMUA workflow lain yang harusnya
    # jalan di commit yang sama, termasuk "pages build and deployment"
    # (workflow bawaan GitHub Pages) — akibatnya versi.json yang baru
    # tidak pernah benar-benar terpublish ke internet walau build sukses.
    # Sekarang pakai tanda kita sendiri ("[bot-publish]", bukan konvensi
    # skip-ci resmi GitHub) supaya HANYA job build ini yang di-skip,
    # sementara workflow Pages tetap jalan normal seperti biasa.
    if: "!contains(github.event.head_commit.message, '[bot-publish]')"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # PENTING: fetch-depth 0 (bukan default 1/shallow) supaya step
          # "Deteksi perubahan native" di bawah bisa git diff sampai ke
          # commit lama (lastBuildCommit di versi.json), bukan cuma commit
          # paling akhir.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor deps
        run: npm install

      - name: Baca info versi lama dari versi.json
        # "build" (nomor build CI mentah, github.run_number) dipakai buat
        # versionCode Android — WAJIB naik terus tiap rilis apapun jenisnya
        # (aturan Android sendiri, kalau tidak HP menolak update APK).
        # nativeBuild/lastBuildCommit lama dibaca dulu di sini, nanti
        # dipakai/ditimpa oleh step "Deteksi perubahan native" di bawah.
        #
        # PENTING: step ini (dan 2 step setelahnya: Hitung tanggal/versi,
        # Deteksi native, Tambah entri Apa Yang Baru) SENGAJA dipindah ke
        # SEBELUM "Kumpulkan file web ke folder www/" — karena step
        # "Tambah entri Apa Yang Baru" perlu MENGUBAH index.html (source,
        # di root repo) SEBELUM index.html itu di-rsync ke www/, supaya
        # entri changelog baru ikut kebawa ke build APK rilis ini juga
        # (bukan baru muncul di rilis berikutnya).
        id: versi
        run: |
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "nativeBuildLama=$(node -p "require('./versi.json').nativeBuild || 0")" >> "$GITHUB_OUTPUT"
          echo "lastBuildCommit=$(node -p "require('./versi.json').lastBuildCommit || ''")" >> "$GITHUB_OUTPUT"

      - name: Hitung tanggal, jam rilis & nomor versi otomatis (WITA)
        # GANTI dari WIB ke WITA (Asia/Makassar, UTC+8) sesuai permintaan.
        #
        # "terbaru" (versionName, teks yg tampil ke pemain) SEKARANG dihitung
        # OTOMATIS dari tanggal & jam rilis, bukan diketik manual lagi di
        # versi.json. Formatnya: {tahunKe}.{bulan}.{tanggal}.{jamMenit}
        #   - tahunKe   = tahun kalender sekarang dikurangi GAME_LAUNCH_YEAR
        #                 lalu +1. Jadi ini BUKAN tahun kalender asli,
        #                 melainkan "game ini sudah jalan tahun ke berapa".
        #                 GAME_LAUNCH_YEAR di-set manual sekali di bawah
        #                 (2026 = tahun game ini mulai jalan) — ubah cuma
        #                 kalau ternyata tahun mulainya beda.
        #   - bulan     = angka bulan apa adanya (1-12, TIDAK di-pad 0),
        #                 mis. Agustus = 8, bukan 08.
        #   - tanggal   = tanggal 2 digit (di-pad 0 kalau perlu), mis. 05.
        #   - jamMenit  = jam+menit digabung 4 digit (HHmm, di-pad 0), mis.
        #                 23:30 -> 2330, 09:05 -> 0905.
        #   Contoh: rilis 22 Agustus 2026 jam 23:30 WITA -> "1.8.22.2330".
        #           rilis 23 Agustus 2026 jam 10:30 WITA -> "1.8.23.1030".
        id: rilis
        env:
          GAME_LAUNCH_YEAR: 2026
        run: |
          node -e "
            const bulanNama=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Makassar'}));
            const pad2 = n => String(n).padStart(2,'0');
            const launchYear = parseInt(process.env.GAME_LAUNCH_YEAR, 10);
            const tahunKe = now.getFullYear() - launchYear + 1;
            const bulan = now.getMonth() + 1;
            const tanggal = pad2(now.getDate());
            const jamMenit = pad2(now.getHours()) + pad2(now.getMinutes());
            const versi = tahunKe + '.' + bulan + '.' + tanggal + '.' + jamMenit;
            const tanggalTampil = pad2(now.getDate())+' '+bulanNama[now.getMonth()]+' '+now.getFullYear()+', '+pad2(now.getHours())+':'+pad2(now.getMinutes())+' WITA';
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'terbaru='+versi+'\n'+'tanggal='+tanggalTampil+'\n');
          "

      - name: Deteksi perubahan native (plugin/dependency)
        # Ini yang MEMISAHKAN "update konten" (hot-update, tidak perlu APK
        # baru) dari "update native" (WAJIB APK baru lewat dialog Install).
        #
        # Dibandingkan file-file yang berubah dari commit terakhir yang
        # SUKSES di-build (lastBuildCommit, disimpan di versi.json) sampai
        # commit sekarang, KHUSUS untuk path yang benar-benar mempengaruhi
        # native shell: package.json/package-lock.json (dependency Capacitor
        # baru/berubah), capacitor.config.json (config native), dan folder
        # plugins/ (kode plugin custom kayak capacitor-apk-installer).
        # Perubahan di index.html/asset lain TIDAK masuk hitungan ini,
        # karena itu cukup lewat hot-update konten saja.
        #
        # Kalau ADA perubahan di path itu -> nativeBuild dinaikkan ke nomor
        # build sekarang (dipakai app buat mewajibkan full APK update).
        # Kalau TIDAK ADA -> nativeBuild dibiarkan sama seperti sebelumnya,
        # jadi HP yang native shell-nya sudah setara tidak akan ditawari
        # APK baru lagi walau contentBuild terus naik di rilis-rilis
        # berikutnya (ini yang memperbaiki masalah "update dobel").
        id: native
        run: |
          LAMA="${{ steps.versi.outputs.lastBuildCommit }}"
          if [ -z "$LAMA" ] || ! git cat-file -e "$LAMA" 2>/dev/null; then
            # Belum pernah tercatat (rilis pertama kali pakai skema ini)
            # atau commit lama sudah tidak ada di histori -> anggap native
            # berubah, biar aman (nativeBuild ikut naik sekali di awal).
            BERUBAH=1
          else
            if git diff --name-only "$LAMA" HEAD -- package.json package-lock.json capacitor.config.json plugins/ | grep -q .; then
              BERUBAH=1
            else
              BERUBAH=0
            fi
          fi
          if [ "$BERUBAH" = "1" ]; then
            echo "nativeBuild=${{ steps.versi.outputs.build }}" >> "$GITHUB_OUTPUT"
          else
            echo "nativeBuild=${{ steps.versi.outputs.nativeBuildLama }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tambah entri "Apa yang Baru" otomatis ke index.html
        # Setiap rilis (SEKALIPUN kecil, lewat hot-update konten saja)
        # otomatis dapat entri baru di menu "🆕 Apa yang Baru" — supaya
        # pemain selalu tahu ada perubahan, bukan cuma pas developer
        # sempat nulis changelog manual yang panjang seperti entri-entri
        # lama di bawahnya.
        #
        # Sumber isinya: pesan commit (git log) dari commit terakhir yang
        # berhasil di-build (lastBuildCommit) sampai commit sekarang.
        # Tiap baris pesan commit jadi satu bullet; tag "Baru"/"Perbaikan"
        # ditebak dari kata kunci di pesannya (mengandung fix/bug/perbaik
        # -> Perbaikan, selain itu -> Baru). Commit dengan tag
        # "[bot-publish]" (commit balik CI sendiri) dilewati, tidak ikut
        # jadi bullet.
        #
        # Kalau suatu saat developer mau nulis entri yang lebih rapi &
        # deskriptif untuk rilis penting (seperti entri-entri lama di
        # bawah), tetap bisa: edit index.html manual dulu SEBELUM push
        # (tambah <div class="changelog-entry"> sendiri tepat di bawah
        # marker) — commit itu ikut ke-diff normal seperti commit lain,
        # tidak ditimpa oleh step ini.
        #
        # Entri baru disisipkan TEPAT SETELAH marker
        # <!-- __ANUMPOLY_CHANGELOG_AUTO__ --> di index.html SOURCE (root
        # repo, BUKAN salinan sync ke android/) — supaya permanen
        # tersimpan di repo & ikut kebawa ke rilis-rilis berikutnya, sama
        # seperti entri-entri lama. Makanya step ini WAJIB jalan SEBELUM
        # "Kumpulkan file web ke folder www/" di bawah.
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const lastCommit = '${{ steps.versi.outputs.lastBuildCommit }}';
            let pesanPesan = [];
            try {
              const range = lastCommit ? (lastCommit + '..HEAD') : 'HEAD';
              const log = execSync('git log ' + range + ' --no-merges --pretty=format:%s', {encoding:'utf8'});
              pesanPesan = log.split('\n').map(s => s.trim()).filter(s => s && !s.includes('[bot-publish]'));
            } catch (e) { pesanPesan = []; }
            if (pesanPesan.length === 0) pesanPesan = ['Pembaruan kecil (perbaikan internal/teknis).'];

            const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const kataFix = /(fix|bug|perbaik|betulin|benerin)/i;
            const bullets = pesanPesan.map(p => {
              const tag = kataFix.test(p)
                ? '<span class=\"cl-tag fix\">Perbaikan</span>'
                : '<span class=\"cl-tag new\">Baru</span>';
              return '      <div style=\"font-size:12.5px;color:var(--paper-dim);line-height:1.6;margin-bottom:6px;\">' + tag + escapeHtml(p) + '</div>';
            }).join('\n');

            const entry = '    <div class=\"changelog-entry\">\n' +
              '      <div class=\"cl-date\">${{ steps.rilis.outputs.tanggal }} — v${{ steps.rilis.outputs.terbaru }}</div>\n' +
              bullets + '\n' +
              '    </div>';

            const marker = '<!-- __ANUMPOLY_CHANGELOG_AUTO__ -->';
            let html = fs.readFileSync('index.html', 'utf8');
            if (!html.includes(marker)) throw new Error('Marker __ANUMPOLY_CHANGELOG_AUTO__ tidak ditemukan di index.html');
            html = html.replace(marker, marker + '\n' + entry);
            fs.writeFileSync('index.html', html);
          "

      - name: Kumpulkan file web ke folder www/
        run: |
          mkdir -p www
          rsync -a \
            --exclude='www' --exclude='android' --exclude='node_modules' \
            --exclude='.git' --exclude='.github' --exclude='package.json' \
            --exclude='package-lock.json' --exclude='capacitor.config.json' \
            --exclude='plugins' --exclude='anumpoly.apk' --exclude='dist.zip' \
            ./ www/
          # "--exclude='dist.zip'" WAJIB ADA di sini. Ini akar bug lama:
          # dist.zip (fitur hot-update, sudah dihapus total) dulu TIDAK
          # di-exclude, jadi ikut ke-rsync ke www/ -> ikut disinkron ke
          # assets/public -> ikut dibundel ke DALAM APK -> ikut di-zip
          # ulang jadi dist.zip rilis berikutnya (berisi dist.zip rilis
          # sebelumnya di dalamnya) -> membengkak terus tiap rilis sampai
          # 74MB. Kalaupun ada dist.zip nyasar lagi di repo suatu saat,
          # baris exclude ini mencegahnya ikut masuk lagi ke build.

      - name: Tambah platform Android
        run: npx cap add android

      - name: Izinkan audio autoplay tanpa perlu tap dulu (MainActivity.java)
        # npx cap add android SELALU membuat ulang MainActivity.java dari
        # template kosong bawaan Capacitor setiap kali workflow ini jalan
        # (folder android/ tidak disimpan di repo, jadi tidak bisa
        # diedit manual sekali lalu dianggap permanen — harus ditimpa
        # ulang di sini setiap build, sama seperti versionCode/versionName
        # di langkah sed di bawah).
        #
        # Alasan perlu ini: Android WebView (sama seperti Chrome) secara
        # default MEWAJIBKAN gesture pengguna (tap/klik) sebelum boleh
        # memutar audio yang ada suaranya — makanya musik latar
        # (anumpoly-bgm.mp3) baru bunyi setelah pemain tap sesuatu di
        # layar. Baris setMediaPlaybackRequiresUserGesture(false) di
        # bawah mematikan aturan itu KHUSUS untuk WebView aplikasi ini
        # (bukan untuk browser HP secara umum), jadi musik boleh langsung
        # autoplay begitu game dibuka.
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          MAIN_ACTIVITY="android/app/src/main/java/$PKG_PATH/MainActivity.java"
          cat > "$MAIN_ACTIVITY" << EOF
          package $APP_ID;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  }
              }
          }
          EOF

      - name: Sinkron file web ke project Android
        run: npx cap sync android

      - name: Tulis versionCode/versionName ke project Android
        # npx cap add android di atas selalu membuat ulang build.gradle
        # dengan versionCode 1 bawaan template.
        # - versionCode (angka bulat) HARUS selalu naik tiap rilis, ini
        #   aturan Android sendiri (kalau tidak, HP menolak update). Jadi
        #   ini dipakai dari nomor build CI (github.run_number) yang
        #   otomatis naik sendiri tiap kali workflow ini jalan — developer
        #   tidak perlu memikirkan angka ini sama sekali.
        # - versionName (teks bebas, mis. "1.8.14") dipakai dari field
        #   "terbaru" di versi.json apa adanya, sesuai skema penomoran
        #   yang developer pilih sendiri (1.8.14 -> 1.8.24 -> 1.9.00 ->
        #   2.0.01, dst) — ini murni kosmetik, tidak wajib naik berurutan
        #   secara matematis, Android tidak mengecek teks ini sama sekali.
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.versi.outputs.build }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.rilis.outputs.terbaru }}\"/" android/app/build.gradle

      - name: Isi info versi & tanggal rilis di tampilan menu awal (index.html)
        # index.html sudah ikut ter-sync ke android/app/src/main/assets/public/
        # di langkah "Sinkron file web ke project Android" di atas. Placeholder
        # __ANUMPOLY_*__ di index.html SENGAJA tidak pernah diganti di file
        # sumber (repo) — hanya diganti di SALINAN hasil sync ini, jadi tiap
        # kali workflow jalan lagi, placeholder-nya selalu ada lagi untuk
        # diisi dengan angka build terbaru.
        run: |
          ASSET=android/app/src/main/assets/public/index.html
          sed -i "s/__ANUMPOLY_VERSION__/${{ steps.rilis.outputs.terbaru }}/" "$ASSET"
          sed -i "s/__ANUMPOLY_BUILD__/${{ steps.versi.outputs.build }}/" "$ASSET"
          sed -i "s/__ANUMPOLY_RELEASE_AT__/${{ steps.rilis.outputs.tanggal }}/" "$ASSET"

      - name: Build APK (release, ditandatangani)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/anumpoly-release.keystore"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/anumpoly-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=anumpoly \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: monopoli-dunia-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Terbitkan/perbarui GitHub Release untuk versi ini
        # GitHub Release ini hanya untuk arsip/riwayat rilis — TIDAK dipakai
        # lagi oleh fitur update dalam-game (lihat step di bawah), karena
        # alamat download release GitHub diblokir CORS saat di-fetch() dari
        # dalam WebView aplikasi (download manual di browser tetap normal,
        # tapi fetch() dari kode JS ditolak).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk anumpoly.apk
          gh release delete "v${{ steps.rilis.outputs.terbaru }}" --yes --cleanup-tag || true
          gh release create "v${{ steps.rilis.outputs.terbaru }}" anumpoly.apk \
            --title "Monopoli Dunia v${{ steps.rilis.outputs.terbaru }}" \
            --notes "Update otomatis dari CI (build #${{ steps.versi.outputs.build }}). Lihat riwayat commit untuk detail perubahan."

      - name: Bersihkan GitHub Release lama (cuma simpan 5 terbaru)
        # Beda dari bug dist.zip kemarin — ini bukan soal ukuran APK,
        # cuma daftar Release yang numpuk terus karena tiap build bikin
        # tag/versi baru yang unik, dan tidak pernah ada yang menghapus
        # rilis LAMA (step di atas cuma hapus rilis dengan tag yang SAMA
        # kalau kebetulan bentrok, bukan rilis-rilis sebelumnya).
        # Di sini semua release diurutkan dari yang paling baru, lalu
        # cuma 5 teratas (termasuk yang baru saja dibuat) yang
        # dipertahankan — sisanya dihapus beserta tag git-nya. Mau
        # simpan riwayat lebih banyak/sedikit? tinggal ubah angka "6" di
        # "tail -n +6" (mis. "+11" buat simpan 10 rilis terakhir).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
            | tail -n +6 \
            | while read -r TAG; do
                echo "Menghapus release lama: $TAG"
                gh release delete "$TAG" --yes --cleanup-tag || true
              done

      - name: Publikasikan APK & catat nomor build ke GitHub Pages
        # Fitur update dalam-game mengunduh APK lewat fetch() di dalam
        # WebView aplikasi — alamat GitHub Pages (domain *.github.io) yang
        # sudah kepakai untuk versi.json TERBUKTI lolos CORS (itu sebabnya
        # deteksi versi baru berhasil), jadi APK-nya juga ditaruh di sini,
        # bukan di GitHub Release yang diblokir CORS. Nama file selalu sama
        # (anumpoly.apk) supaya link_apk di versi.json tidak perlu berubah
        # tiap rilis.
        #
        # Field versi di versi.json ditulis ulang otomatis di sini, DIPECAH
        # jadi dua nomor build (ini yang memperbaiki masalah "update dobel"):
        #   - contentBuild = nomor build CI sekarang, SELALU naik tiap rilis
        #     apapun. Dipakai fitur hot-update KONTEN (update-check.js) buat
        #     tahu ada bundle baru atau tidak.
        #   - nativeBuild = dari step "Deteksi perubahan native" di atas.
        #     Cuma naik kalau rilis ini benar-benar mengubah sesuatu yang
        #     butuh APK baru (plugin/dependency/config native). Dipakai
        #     fitur update APK PENUH buat tahu native shell yang kepasang
        #     di HP masih setara atau tidak — kalau masih setara, APK baru
        #     tidak akan ditawarkan lagi walau contentBuild terus naik.
        #   - lastBuildCommit = SHA commit sekarang, disimpan supaya build
        #     berikutnya tahu dari titik mana harus mulai diff pas
        #     "Deteksi perubahan native".
        # "terbaru" sekarang OTOMATIS dari step "Hitung tanggal, jam rilis
        # & nomor versi otomatis (WITA)" di atas, tidak diedit manual lagi.
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk anumpoly.apk
          COMMIT_SEKARANG=$(git rev-parse HEAD)
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('versi.json','utf8'));
            v.terbaru = '${{ steps.rilis.outputs.terbaru }}';
            v.contentBuild = ${{ steps.versi.outputs.build }};
            v.nativeBuild = ${{ steps.native.outputs.nativeBuild }};
            v.lastBuildCommit = '$COMMIT_SEKARANG';
            v.tanggal_rilis = '${{ steps.rilis.outputs.tanggal }}';
            delete v.terbaruBuild; // field lama, sudah digantikan contentBuild/nativeBuild
            delete v.link_bundle; // fitur hot-update (dist.zip) sudah dihapus total
            fs.writeFileSync('versi.json', JSON.stringify(v, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anumpoly.apk versi.json index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, tidak perlu commit baru."
          else
            # PENTING: dulu di sini pakai "git pull --rebase origin main" lalu
            # "git push". Masalahnya: kalau origin/main sudah berubah duluan
            # (mis. ada commit [bot-publish] lain yang lebih baru masuk),
            # rebase akan coba menggabungkan anumpoly.apk versi lama (commit
            # ini) dengan versi baru di origin/main — dan karena APK itu file
            # BINARY, git sama sekali tidak bisa menggabungkan isinya, jadi
            # selalu CONFLICT dan build gagal (exit code 1).
            #
            # Fix: fetch origin/main lalu "reset --soft" ke situ. Ini
            # menaruh HEAD ke commit main paling baru TANPA membuang file
            # hasil build yang sudah di-stage (anumpoly.apk, versi.json
            # tetap ada di working directory/index). Jadi commit publish
            # ini dibuat ulang di atas fondasi main yang paling mutakhir -
            # bukan digabung dengan riwayat lama - sehingga tidak pernah
            # ada conflict merge/rebase di file binary lagi.
            git fetch origin main
            git reset --soft origin/main
            git add anumpoly.apk versi.json index.html
            git commit -m "chore: publikasikan anumpoly.apk v${{ steps.rilis.outputs.terbaru }} (build #${{ steps.versi.outputs.build }}) [bot-publish]"
            git push origin HEAD:main
          fi